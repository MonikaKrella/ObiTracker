name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - name: Start Supabase local
        run: supabase start
      - name: Export local Supabase credentials
        run: |
          echo "=== supabase status -o json ==="
          supabase status -o json 2>/dev/null
          STATUS=$(supabase status -o json 2>/dev/null)
          ANON_KEY=$(echo "$STATUS" | jq -r '.ANON_KEY // .PUBLISHABLE_KEY')
          SVC_KEY=$(echo "$STATUS"  | jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY')
          echo "ANON_KEY length: ${#ANON_KEY}, SVC_KEY length: ${#SVC_KEY}"
          echo "SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "SUPABASE_KEY=${ANON_KEY}" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=${SVC_KEY}" >> $GITHUB_ENV
      - name: Verify database grants
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -c \
            "SELECT grantee, privilege_type FROM information_schema.role_table_grants WHERE table_name='dogs' AND table_schema='public' ORDER BY grantee, privilege_type;"
      - run: npm run test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
