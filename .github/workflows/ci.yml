name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - name: Start Supabase local
        run: supabase start
      - name: Export local Supabase credentials
        run: |
          STATUS=$(supabase status -o json 2>/dev/null)
          echo "SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "SUPABASE_KEY=$(echo "$STATUS" | jq -r '.ANON_KEY')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r '.SERVICE_ROLE_KEY')" >> $GITHUB_ENV
      - name: Verify PostgREST JWT auth
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_KEY: ${{ env.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "--- create temp user ---"
          curl -s -X POST "$SUPABASE_URL/auth/v1/admin/users" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-jwt@test.com","password":"Test123!","email_confirm":true}' \
            | jq '{email:.email, error:.message}'

          echo "--- sign in ---"
          TOKEN_RESP=$(curl -s -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-jwt@test.com","password":"Test123!"}')
          JWT=$(echo "$TOKEN_RESP" | jq -r '.access_token // empty')
          echo "JWT obtained (first 30): ${JWT:0:30}..."
          echo "JWT claims: $(echo "$JWT" | cut -d. -f2 | base64 -d 2>/dev/null | jq .)"

          echo "--- PostgREST /dogs WITHOUT auth ---"
          curl -s "$SUPABASE_URL/rest/v1/dogs" -H "apikey: $SUPABASE_KEY"

          echo "--- PostgREST /dogs WITH JWT ---"
          curl -s "$SUPABASE_URL/rest/v1/dogs" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $JWT"
      - run: npm run test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
